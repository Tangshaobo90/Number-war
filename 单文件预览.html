<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>唐少博的数字战争</title>
<style>
:root {
  color: #774218;
  background: #8ed9ff;
  font-family: "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: geometricPrecision;
}

* {
  box-sizing: border-box;
}

body {
  position: relative;
  margin: 0;
  min-width: 320px;
  min-height: 100svh;
  overflow-x: hidden;
  background:
    linear-gradient(180deg, rgba(255, 245, 201, 0.05), rgba(255, 245, 201, 0.12)),
    url("./public/skin/bg.png") center top / cover no-repeat fixed,
    #8ed9ff;
}

body::before,
body::after {
  content: "";
  display: none;
  pointer-events: none;
}

body::before {
  z-index: 0;
  top: 0;
  height: 34svh;
  opacity: 0.72;
  background:
    radial-gradient(circle at 20% 76%, #f9bad5 0 18px, transparent 19px),
    radial-gradient(circle at 24% 74%, #fff1de 0 52px, transparent 53px),
    linear-gradient(180deg, transparent 0 54%, #f7d4c8 55% 100%) 14% 100% / 86px 135px no-repeat,
    linear-gradient(180deg, transparent 0 42%, #f5c7c3 43% 100%) 24% 100% / 66px 112px no-repeat,
    linear-gradient(135deg, transparent 0 40%, #ed7da3 41% 60%, transparent 61%) 14% 45% / 86px 72px no-repeat,
    linear-gradient(135deg, transparent 0 40%, #df6e9e 41% 60%, transparent 61%) 24% 49% / 66px 58px no-repeat,
    radial-gradient(circle at 8% 92%, #a8d96a 0 68px, transparent 69px),
    radial-gradient(circle at 93% 88%, #b9dc63 0 92px, transparent 93px);
}

body::after {
  z-index: 0;
  bottom: 0;
  height: 22svh;
  background:
    radial-gradient(circle at 7% 75%, #f26fa3 0 34px, transparent 35px),
    radial-gradient(circle at 91% 68%, #e7583c 0 42px, transparent 43px),
    radial-gradient(circle at 83% 85%, #4fc7e9 0 25px, transparent 26px),
    radial-gradient(circle at 20% 102%, #84bd43 0 150px, transparent 151px),
    radial-gradient(circle at 72% 108%, #91c84e 0 180px, transparent 181px),
    linear-gradient(180deg, transparent 0%, rgba(132, 181, 60, 0.75) 70%, rgba(111, 155, 44, 0.9) 100%);
}

button {
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.game-shell {
  position: relative;
  z-index: 1;
  --shell-width: min(100vw, 930px, max(340px, calc(100svh * 0.55)));
  --shell-pad-x: clamp(14px, 2vw, 24px);
  --board-gap: clamp(8px, 1.22vw, 14px);
  --board-pad: clamp(12px, 1.65vw, 20px);
  --random-tile-size: clamp(
    46px,
    calc(
      (
          var(--shell-width) - var(--shell-pad-x) - var(--shell-pad-x) - var(--board-pad) -
            var(--board-pad) - var(--board-gap) - var(--board-gap) - var(--board-gap) -
            var(--board-gap) - var(--board-gap)
        ) / 6
    ),
    126px
  );
  --reserve-tile-size: calc(var(--random-tile-size) / 2);
  --panel-radius: clamp(14px, calc(var(--random-tile-size) * 0.2), 28px);
  --tile-radius: clamp(12px, calc(var(--random-tile-size) * 0.18), 25px);
  --small-tile-radius: calc(var(--tile-radius) * 0.56);
  --current-radius: var(--tile-radius);
  --modal-button-radius: 18px;
  --top-gap: clamp(8px, 1.35vw, 14px);
  --score-card-height: clamp(58px, calc(var(--random-tile-size) * 0.84), 104px);
  --tool-height: clamp(74px, calc(var(--random-tile-size) * 0.98), 112px);
  --tool-label-height: clamp(19px, calc(var(--random-tile-size) * 0.22), 28px);
  --switch-label-height: clamp(22px, calc(var(--random-tile-size) * 0.24), 32px);
  --top-bottom-gap: clamp(10px, 1.6vh, 18px);
  width: var(--shell-width);
  min-height: 100svh;
  margin: 0 auto;
  padding: clamp(4px, 0.9vh, 14px) var(--shell-pad-x) clamp(8px, 1.4vh, 18px);
}

.game-shell::before,
.game-shell::after {
  display: none;
}

h1,
.record-line,
.top-layout,
.board-wrap,
.restart-button,
footer,
.overlay {
  position: relative;
  z-index: 1;
}

h1 {
  position: relative;
  width: min(84%, 610px);
  height: clamp(96px, 15.5svh, 176px);
  margin: 0 auto -2px;
  overflow: hidden;
  color: transparent;
  font-size: 0;
  line-height: 0;
  white-space: nowrap;
  background: url("./public/skin/logo.png") center / contain no-repeat;
  filter: drop-shadow(0 12px 12px rgba(112, 55, 16, 0.18));
  -webkit-text-stroke: 0;
}

h1::before,
h1::after {
  display: none;
}

h1 span {
  display: inline;
}

.record-line {
  margin: 0 0 clamp(7px, 1.1vh, 13px);
  text-align: center;
  color: #83450f;
  font-size: clamp(14px, calc(var(--shell-width) * 0.028), 24px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: 0;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 246, 220, 0.9);
}

.top-layout {
  display: grid;
  grid-template-columns: 1.16fr 1fr 1fr;
  grid-template-rows: var(--score-card-height) var(--tool-height);
  gap: var(--top-gap);
  align-items: stretch;
  margin-bottom: var(--top-bottom-gap);
}

.number-switch,
.score-card,
.tool,
.board-wrap,
.restart-button,
.modal {
  border: clamp(3px, 0.5vw, 6px) solid #ffe1a6;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.46) 0 42%, transparent 43%),
    linear-gradient(180deg, #fff2ce 0%, #ffd28c 100%);
  box-shadow:
    inset 0 5px 0 rgba(255, 255, 255, 0.62),
    inset 0 -6px 0 rgba(181, 93, 30, 0.22),
    0 5px 0 rgba(146, 78, 26, 0.28),
    0 11px 18px rgba(102, 61, 20, 0.18);
}

.number-switch {
  position: relative;
  container-type: inline-size;
  --reserve-tile-size: calc(var(--random-tile-size) * 0.66);
  --switch-label-top-space: clamp(8px, calc(var(--random-tile-size) * 0.12), 14px);
  --switch-label-block: calc(var(--tool-label-height) + var(--switch-label-top-space));
  grid-column: 1;
  grid-row: 1 / span 2;
  display: grid;
  grid-template-columns: minmax(0, 0.74fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) var(--switch-label-block);
  column-gap: clamp(10px, 1.6vw, 18px);
  row-gap: clamp(9px, 1.1vw, 14px);
  align-items: center;
  justify-content: center;
  min-height: 0;
  height: 100%;
  padding: clamp(15px, 1.85vw, 24px) clamp(14px, 1.9vw, 24px) clamp(8px, 1vw, 12px);
  border-width: clamp(4px, 0.62vw, 7px);
  border-color: #ffe6aa;
  border-radius: clamp(20px, calc(var(--random-tile-size) * 0.27), 34px);
  background:
    linear-gradient(180deg, rgba(255, 248, 225, 0.34) 0%, rgba(255, 230, 171, 0.2) 100%),
    linear-gradient(180deg, #f7c875 0%, #edb361 52%, #df9948 100%);
  box-shadow:
    inset 0 0 0 clamp(4px, 0.55vw, 7px) rgba(255, 232, 165, 0.5),
    inset 0 5px 0 rgba(255, 255, 255, 0.52),
    inset 0 -8px 0 rgba(142, 69, 20, 0.2),
    0 5px 0 rgba(139, 75, 24, 0.3),
    0 13px 20px rgba(98, 55, 18, 0.2);
}

.number-switch::before,
.number-switch::after {
  content: "";
  position: absolute;
  pointer-events: none;
}

.number-switch::before {
  left: clamp(9px, 1.4vw, 16px);
  top: clamp(8px, 1.2vw, 14px);
  z-index: 0;
  width: clamp(26px, calc(var(--random-tile-size) * 0.32), 45px);
  aspect-ratio: 1;
  background: #fff8da;
  clip-path: polygon(50% 0, 60% 38%, 100% 50%, 60% 62%, 50% 100%, 40% 62%, 0 50%, 40% 38%);
  filter: drop-shadow(0 1px 0 #ce842b);
}

.number-switch::after {
  display: block;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  height: var(--switch-label-block);
  width: auto;
  aspect-ratio: auto;
  border-radius: 0 0 clamp(16px, calc(var(--random-tile-size) * 0.24), 31px) clamp(16px, calc(var(--random-tile-size) * 0.24), 31px);
  background: linear-gradient(180deg, rgba(255, 194, 91, 0.68) 0%, rgba(219, 139, 48, 0.72) 100%);
  clip-path: none;
  opacity: 1;
  box-shadow:
    inset 0 2px 0 rgba(255, 230, 165, 0.25),
    inset 0 -2px 0 rgba(141, 74, 21, 0.12);
}

.number-switch-title {
  grid-column: 1 / -1;
  grid-row: 2;
  justify-self: center;
  align-self: end;
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 0.34em;
  height: var(--tool-label-height);
  max-width: 100%;
  margin-bottom: -3px;
  color: #8a4213;
  font-size: clamp(12px, calc(var(--shell-width) * 0.018), 18px);
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 241, 202, 0.96);
}

.number-switch-title::before {
  content: "↻";
  font-size: 1.08em;
  line-height: 1;
}

.preview,
.current,
.cell {
  position: relative;
  display: grid;
  place-items: center;
  border-radius: var(--tile-radius);
  color: #8a4315;
  background: var(--tile-color, #fff2d8);
  font-weight: 900;
  line-height: 1;
  overflow: hidden;
}

.preview,
.current,
.cell.tile {
  border: clamp(2px, calc(var(--random-tile-size) * 0.026), 4px) solid rgba(255, 242, 212, 0.66);
  box-shadow:
    inset 5px 6px 0 rgba(255, 255, 255, 0.5),
    inset -5px -6px 0 rgba(140, 75, 26, 0.17),
    0 4px 0 rgba(118, 67, 30, 0.22),
    0 7px 10px rgba(110, 64, 30, 0.16);
}

.preview::after,
.current::after,
.cell.tile::after {
  content: "";
  position: absolute;
  inset: 7% 9% auto auto;
  width: 30%;
  height: 18%;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.34);
  transform: rotate(-24deg);
  pointer-events: none;
}

.preview {
  z-index: 1;
  container-type: inline-size;
  --number-size: 67cqw;
  grid-row: 1;
  width: var(--reserve-tile-size);
  height: var(--reserve-tile-size);
  aspect-ratio: 1;
  flex: 0 0 var(--reserve-tile-size);
  justify-self: center;
  align-self: center;
  border-radius: var(--small-tile-radius);
  color: #8a4315;
  font-size: clamp(12px, 4.2vw, 48px);
  text-shadow: 0 1px 0 rgba(255, 244, 214, 0.82);
}

.current {
  z-index: 1;
  container-type: inline-size;
  --number-size: 69cqw;
  grid-row: 1;
  width: var(--random-tile-size);
  height: var(--random-tile-size);
  aspect-ratio: 1;
  flex: 0 0 var(--random-tile-size);
  justify-self: center;
  align-self: center;
  border-radius: var(--current-radius);
  font-size: clamp(26px, 8.5vw, 104px);
}

.number-switch .preview {
  color: #8a4315;
  text-shadow: 0 1px 0 rgba(255, 244, 214, 0.82);
}

.score-card {
  container-type: inline-size;
  display: grid;
  grid-template-rows: auto auto;
  align-content: center;
  justify-items: center;
  row-gap: 2px;
  min-height: 0;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  padding: 0 clamp(8px, 1.4vw, 14px);
  border-radius: var(--panel-radius);
  color: #7e4113;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0 42%, transparent 43%),
    linear-gradient(180deg, #fff6de 0%, #ffdda6 100%);
}

.score-current {
  grid-column: 2;
  grid-row: 1;
}

.score-high {
  grid-column: 3;
  grid-row: 1;
}

.score-card span {
  max-width: 100%;
  font-size: min(23px, 14cqw);
  font-weight: 900;
  white-space: nowrap;
}

.score-card strong {
  display: block;
  max-width: 100%;
  overflow: hidden;
  color: #7a3b12;
  font-size: min(45px, 23cqw);
  line-height: 0.92;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  white-space: nowrap;
}

.tools {
  grid-column: 2 / 4;
  grid-row: 2;
  --tool-badge-outset: clamp(6px, 0.86vw, 10px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--top-gap);
  min-height: 0;
  margin: 0;
  padding-right: var(--tool-badge-outset);
  overflow: visible;
}

.tool {
  position: relative;
  display: grid;
  grid-template-rows: minmax(0, 1fr) var(--tool-label-height);
  align-content: stretch;
  justify-items: center;
  row-gap: clamp(2px, calc(var(--random-tile-size) * 0.03), 5px);
  width: 100%;
  min-height: 0;
  height: 100%;
  overflow: visible;
  padding: clamp(6px, 0.8vw, 10px) clamp(5px, 0.7vw, 8px) clamp(5px, 0.7vw, 8px);
  border-color: #f5c783;
  border-radius: calc(var(--panel-radius) * 0.72);
  background:
    linear-gradient(180deg, #fff0c9 0%, #ffd08d 100%);
  box-shadow:
    inset 0 4px 0 rgba(255, 255, 255, 0.58),
    inset 0 -5px 0 rgba(174, 92, 31, 0.18),
    0 4px 0 rgba(147, 82, 31, 0.24);
}

.tool::before {
  content: "";
  position: absolute;
  inset: 0 0 var(--tool-label-height);
  z-index: 0;
  overflow: hidden;
  border-radius: calc(var(--panel-radius) * 0.64) calc(var(--panel-radius) * 0.64) 0 0;
  background:
    radial-gradient(ellipse at 18% 18%, rgba(255, 255, 255, 0.82) 0 12%, transparent 13%),
    radial-gradient(ellipse at 82% 16%, rgba(255, 255, 255, 0.54) 0 8%, transparent 9%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0 38%, transparent 39%),
    linear-gradient(180deg, #b8fbf3 0%, #72dce8 56%, #4bc7dc 100%);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, 0.58),
    inset 0 -4px 0 rgba(59, 129, 157, 0.24),
    0 2px 0 rgba(132, 75, 29, 0.18);
}

.tool::after {
  content: attr(title);
  display: grid;
  place-items: center;
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  bottom: 0;
  width: auto;
  height: var(--tool-label-height);
  max-width: none;
  margin: 0;
  padding: 0 2px;
  overflow: hidden;
  border-radius: 0 0 calc(var(--panel-radius) * 0.64) calc(var(--panel-radius) * 0.64);
  color: #8a4213;
  font-size: clamp(12px, calc(var(--shell-width) * 0.018), 18px);
  font-weight: 900;
  line-height: 1;
  text-align: center;
  text-shadow: 0 1px 0 rgba(255, 241, 202, 0.96);
  white-space: nowrap;
  background: linear-gradient(180deg, rgba(255, 242, 204, 0.96) 0%, rgba(255, 204, 130, 0.84) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.48);
}

.tool:disabled {
  cursor: default;
  opacity: 0.55;
}

.tool.active {
  outline: clamp(3px, 0.55vw, 5px) solid #ffdd4c;
  filter: brightness(1.08);
}

.tool.used {
  cursor: default;
}

.tool.effect .tool-icon {
  animation: tool-pop 0.48s ease-out;
  filter: drop-shadow(0 0 16px rgba(255, 220, 82, 0.92));
}

.badge {
  position: absolute;
  z-index: 4;
  top: calc(var(--tool-badge-outset, clamp(6px, 0.86vw, 10px)) * -1);
  right: calc(var(--tool-badge-outset, clamp(6px, 0.86vw, 10px)) * -1);
  display: grid;
  place-items: center;
  width: clamp(17px, calc(var(--random-tile-size) * 0.2), 25px);
  height: clamp(17px, calc(var(--random-tile-size) * 0.2), 25px);
  border: clamp(2px, calc(var(--random-tile-size) * 0.025), 3px) solid #fff5df;
  border-radius: 50%;
  color: #fff;
  background: linear-gradient(180deg, #ff6572 0%, #e13e4c 100%);
  font-size: clamp(10px, calc(var(--random-tile-size) * 0.13), 15px);
  font-weight: 900;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.42),
    0 2px 0 #9b2f3a;
}

.tool-icon,
.rule-tool-icon {
  position: relative;
  z-index: 1;
  grid-row: 1;
  align-self: center;
  display: grid;
  place-items: center;
  width: clamp(32px, calc(var(--random-tile-size) * 0.56), 68px);
  height: clamp(32px, calc(var(--random-tile-size) * 0.56), 68px);
  line-height: 1;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.tool-icon svg,
.rule-tool-icon svg {
  display: none;
}

.tool-undo .tool-icon,
.rule-card:nth-child(2) .rule-tool:nth-child(4) .rule-tool-icon {
  background-image: url("./public/skin/undo.png");
}

.tool-shovel .tool-icon,
.rule-card:nth-child(2) .rule-tool:nth-child(1) .rule-tool-icon {
  background-image: url("./public/skin/shovel.png");
}

.tool-wand .tool-icon,
.rule-card:nth-child(2) .rule-tool:nth-child(2) .rule-tool-icon {
  background-image: url("./public/skin/wand.png");
}

.tool-bomb .tool-icon,
.rule-card:nth-child(2) .rule-tool:nth-child(3) .rule-tool-icon {
  background-image: url("./public/skin/bomb.png");
}

.board-wrap {
  position: relative;
  padding: var(--board-pad);
  border-color: #ffdea1;
  border-radius: calc(var(--panel-radius) * 1.08);
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 226, 184, 0.16) 0 26%, transparent 27%) 0 0 / calc(var(--random-tile-size) + var(--board-gap)) calc(var(--random-tile-size) + var(--board-gap)),
    linear-gradient(90deg, rgba(104, 53, 18, 0.05) 0 1px, transparent 1px 100%) 0 0 / 45px 100%,
    linear-gradient(180deg, #c89460 0%, #a96f41 100%);
  box-shadow:
    inset 0 0 0 clamp(6px, 0.9vw, 10px) #ffe6b0,
    inset 0 5px 0 rgba(255, 255, 255, 0.38),
    inset 0 -8px 0 rgba(116, 60, 24, 0.2),
    0 6px 0 rgba(126, 68, 28, 0.3),
    0 16px 26px rgba(111, 66, 23, 0.2);
}

.board-wrap::before,
.board-wrap::after {
  display: none;
}

.board-wrap::before {
  left: -12px;
  top: -16px;
}

.board-wrap::after {
  right: -12px;
  bottom: -18px;
  transform: rotate(180deg);
}

.board {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--board-gap);
}

.cell {
  container-type: inline-size;
  --number-size: 60cqw;
  aspect-ratio: 1;
  width: 100%;
  min-width: 0;
  border-radius: var(--tile-radius);
  background:
    radial-gradient(circle at 50% 50%, rgba(153, 94, 45, 0.13) 0 20%, transparent 21%),
    linear-gradient(180deg, #ddb184 0%, #c18a58 100%);
  color: transparent;
  font-size: clamp(14px, 5.4vw, 70px);
  box-shadow:
    inset 5px 6px 0 rgba(255, 231, 194, 0.38),
    inset -5px -6px 0 rgba(119, 63, 23, 0.17),
    0 4px 0 rgba(101, 60, 28, 0.22);
}

.cell.empty::before {
  content: "";
  position: absolute;
  inset: 34%;
  background: rgba(154, 95, 46, 0.1);
  clip-path: polygon(50% 0, 62% 35%, 98% 35%, 68% 57%, 79% 92%, 50% 72%, 21% 92%, 32% 57%, 2% 35%, 38% 35%);
}

.tile-number {
  position: relative;
  z-index: 1;
  display: block;
  max-width: 100%;
  overflow: hidden;
  font-size: var(--number-size);
  line-height: 0.95;
  letter-spacing: 0;
  white-space: nowrap;
}

.preview.rank-4,
.preview.rank-5 {
  --number-size: 52cqw;
}

.preview.rank-6,
.preview.rank-7 {
  --number-size: 43cqw;
}

.preview.rank-8,
.preview.rank-9 {
  --number-size: 34cqw;
}

.preview.rank-10,
.preview.rank-11 {
  --number-size: 28cqw;
}

.current.rank-4,
.current.rank-5 {
  --number-size: 55cqw;
}

.current.rank-6,
.current.rank-7 {
  --number-size: 43cqw;
}

.current.rank-8,
.current.rank-9 {
  --number-size: 34cqw;
}

.current.rank-10,
.current.rank-11 {
  --number-size: 28cqw;
}

.cell.rank-4,
.cell.rank-5 {
  --number-size: 50cqw;
}

.cell.rank-6,
.cell.rank-7 {
  --number-size: 40cqw;
}

.cell.rank-8,
.cell.rank-9 {
  --number-size: 33cqw;
}

.cell.rank-10,
.cell.rank-11 {
  --number-size: 27cqw;
}

.cell.tile {
  color: #844014;

function generateTile(random = Math.random(), highestCreated = 0) {
  const options = getSpawnOptions(highestCreated);
  const totalWeight = options.reduce((sum, option) => sum + option.weight, 0);
  const roll = Math.min(Math.max(random, 0), 0.999999);
  const target = roll * totalWeight;
  let cursor = 0;

  for (const option of options) {
    cursor += option.weight;
    if (target < cursor) return option.value;

  return options[options.length - 1].value;

function isBoardFull(board) {

function findConnectedGroup(board, row, col) {
  const value = board[row]?.[col];
  if (value === null || value === undefined) return [];

  const seen = new Set();
  const queue = [{ row, col }];
  const group = [];

  while (queue.length > 0) {
    const current = queue.shift();
    const key = `${current.row}:${current.col}`;
    if (seen.has(key)) continue;
    seen.add(key);

    if (board[current.row]?.[current.col] !== value) continue;
    group.push(current);

    for (const [rowOffset, colOffset] of [
      [-1, 0],
      [1, 0],
      [0, -1],
      [0, 1],

      const nextRow = current.row + rowOffset;
      const nextCol = current.col + colOffset;
      if (nextRow >= 0 && nextRow < BOARD_SIZE && nextCol >= 0 && nextCol < BOARD_SIZE) {

function pickMergeCells(group, anchor) {
  return [
    anchor,
    ...group
      .filter((cell) => cell.row !== anchor.row || cell.col !== anchor.col)
      .sort((a, b) => {
        const distanceA = Math.abs(a.row - anchor.row) + Math.abs(a.col - anchor.col);
        const distanceB = Math.abs(b.row - anchor.row) + Math.abs(b.col - anchor.col);

        if (a.row !== b.row) return a.row - b.row;

function resolveBoardFrom(board, row, col) {
  const nextBoard = cloneBoard(board);
  let scoreGain = 0;
  let combo = 0;
  const events = [];
  let anchor = { row, col };

  while (true) {
    const currentValue = nextBoard[anchor.row][anchor.col];
    if (currentValue === LEVELS[LEVELS.length - 1].value) break;

    const group = findConnectedGroup(nextBoard, anchor.row, anchor.col);
    if (group.length < 3) break;

    const nextValue = upgradeValue(currentValue);
    const removed = pickMergeCells(group, anchor);
    for (const cell of removed) {

    events.push({
      combo,
      from: currentValue,
      to: nextValue,
      removed,

      anchor,

const audioFiles = {
  click: "click.mp3",
  swap: "swap.mp3",
  place: "place.mp3",
  merge: "merge.mp3",
  newMerge: "new-merge.mp3",
  fail: "fail.mp3",

};
const audioPoolSize = 4;
const audioPools = new Map();
const audioBuffers = new Map();
const audioBufferPromises = new Map();
let audioContext = null;

function audioPath(file) {
  return (location.protocol === "file:" ? "./public/audio/" : "/audio/") + file;
}

function getAudioContext() {
  if (typeof window === "undefined") return null;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioContext) {
    audioContext = new AudioContextClass();
  }
  return audioContext;
}

function unlockAudioContext() {
  const context = getAudioContext();
  if (!context || context.state !== "suspended") return;
  context.resume().catch(() => {});
}

function loadAudioBuffer(name) {
  if (typeof window === "undefined" || location.protocol === "file:") {
    return Promise.resolve(null);
  }

  if (audioBuffers.has(name)) return Promise.resolve(audioBuffers.get(name));
  if (audioBufferPromises.has(name)) return audioBufferPromises.get(name);

  const promise = fetch(audioPath(audioFiles[name]))
    .then((response) => response.arrayBuffer())
    .then((data) => {
      const context = getAudioContext();
      if (!context) return null;
      return context.decodeAudioData(data);
    })
    .then((buffer) => {
      if (buffer) audioBuffers.set(name, buffer);
      return buffer;
    })
    .catch(() => null);

  audioBufferPromises.set(name, promise);
  return promise;
}

function playBufferedSound(name) {
  const context = getAudioContext();
  const buffer = audioBuffers.get(name);
  if (!context || context.state !== "running" || !buffer) return false;

  const source = context.createBufferSource();
  const gain = context.createGain();
  gain.gain.value = 0.9;
  source.buffer = buffer;
  source.connect(gain);
  gain.connect(context.destination);
  source.start(0);
  return true;
}

function createAudio(name) {
  if (typeof Audio === "undefined") return null;
  const audio = new Audio(audioPath(audioFiles[name]));
  audio.preload = "auto";
  audio.volume = 0.9;
  audio.setAttribute("playsinline", "true");
  audio.setAttribute("webkit-playsinline", "true");
  audio.load();
  return audio;
}

function getAudioPool(name) {
  if (audioPools.has(name)) return audioPools.get(name);
  const items = Array.from({ length: audioPoolSize }, () => createAudio(name)).filter(Boolean);
  if (!items.length) return null;
  const pool = { items, index: 0 };
  audioPools.set(name, pool);
  return pool;
}

function preloadSounds() {
  Object.keys(audioFiles).forEach((name) => {
    getAudioPool(name);
    loadAudioBuffer(name);
  });
}

function setupAudioUnlockListeners() {
  const unlock = () => {
    unlockAudioContext();
    preloadSounds();
  };
  const options = { capture: true, passive: true };
  window.addEventListener("pointerdown", unlock, options);
  window.addEventListener("touchstart", unlock, options);
  window.addEventListener("click", unlock, options);
  window.addEventListener("keydown", unlock, options);
}

function playSound(name) {
  unlockAudioContext();
  preloadSounds();
  if (playBufferedSound(name)) return;

  const pool = getAudioPool(name);
  if (!pool) return;
  const audio = pool.items[pool.index];
  if (!audio) return;
  pool.index = (pool.index + 1) % pool.items.length;
  audio.muted = false;
  audio.volume = 0.9;
  if (audio.readyState === 0) audio.load();
  try {
    audio.currentTime = 0;
  } catch {
    // Some mobile browsers do not allow seeking before metadata is ready.
  }
  audio.play().catch(() => {
    const fallback = createAudio(name);
    if (!fallback) return;
    fallback.muted = false;
    fallback.volume = 0.9;
    fallback.play().catch(() => {});
  });
}

function playMergeSound(events, previousHighest) {
  if (!events.length) return;
  const madeNewHighest = events.some((event) => event.to > previousHighest);
  playSound(madeNewHighest ? "newMerge" : "merge");
}

function readRecord() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { highScore: 0, highestTile: 0, games: 0, totalSeconds: 0 };
    return Object.assign({ highScore: 0, highestTile: 0, games: 0, totalSeconds: 0 }, JSON.parse(raw));
  } catch {
    return { highScore: 0, highestTile: 0, games: 0, totalSeconds: 0 };
  }
}

function writeRecord() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      highScore: Math.max(record.highScore, score),
      highestTile: Math.max(record.highestTile, highest),
      games: record.games,
      totalSeconds: record.totalSeconds + sessionSeconds,
    })
  );
}

function copyBoard(source) {
  return source.map((row) => row.slice());
}

function savePlacementSnapshot() {
  snapshot = {
    board: copyBoard(board),
    score,
    main,
    reserve,
    highest,
    tools: Object.assign({}, tools),
  };
}

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  return minutes + ":" + String(seconds % 60).padStart(2, "0");
}

function tileClass(value) {
  const key = arguments.length > 1 ? arguments[1] : "";
  if (value === null) {
    return ["cell empty", effects.cells.has(key) ? "effect" : ""].filter(Boolean).join(" ");
  }
  const rank = getLevel(value).rank;
  return [
    "cell tile",
    "rank-" + rank,
    effects.cells.has(key) ? "effect" : "",
    rank >= 6 ? "glow" : "",
    rank >= 7 ? "particle" : "",
    rank >= 8 ? "stream" : "",
    rank === 11 ? "crown" : "",
  ]
    .filter(Boolean)
    .join(" ");
}

function tileStyle(value) {
  if (value === null) return "";
  const level = getLevel(value);
  if (level.rank >= 10) return "";
  return 'style="--tile-color:' + level.color + '"';
}

function updateRecords() {
  highest = Math.max(highest, maxBoardValue(board));
  record.highScore = Math.max(record.highScore, score);
  record.highestTile = Math.max(record.highestTile, highest);

}

    cell.addEventListener("pointerup", (event) => {
      event.preventDefault();
      handleCell(row, col);
    });
    cell.addEventListener("click", (event) => {
      event.preventDefault();
      handleCell(row, col);
    });
  });

  app.querySelectorAll('[data-role="restart"]').forEach((button) => {
    button.addEventListener("click", restart);
  });

  app.querySelectorAll('[data-role="start-rules"]').forEach((button) => {
    button.addEventListener("click", closeRules);
  });

  app.querySelectorAll('[data-role="cancel-undo"]').forEach((button) => {
    button.addEventListener("click", () => {
      playSound("click");
      confirmUndoOpen = false;
      render();
    });
  });

  app.querySelectorAll('[data-role="confirm-undo"]').forEach((button) => {
    button.addEventListener("click", confirmUndo);
  });
}

function handleNumberSwitchEvent(event) {
  event.preventDefault();
  event.stopPropagation();
  const now = Date.now();
  if (now - lastSwitchEventTime < 160) return;
  lastSwitchEventTime = now;
  swapNumbers();
}

function closeRules() {
  playSound("click");
  showRules = false;
  render();
}

function handleDelegatedCellEvent(event) {
  const cell = event.target.closest?.("[data-row][data-col]");
  if (!cell || !app.contains(cell)) return;
  event.preventDefault();
  handleCell(Number(cell.dataset.row), Number(cell.dataset.col));
}

globalThis.cellPress = function cellPress(event, row, col) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  handleCell(row, col);
};

function isDuplicateCellEvent(row, col) {
  const now = Date.now();
  const duplicate = lastCellEvent.row === row && lastCellEvent.col === col && now - lastCellEvent.time < 180;
  lastCellEvent = { row, col, time: now };
  return duplicate;
}

function handleCell(row, col) {
  if (isDuplicateCellEvent(row, col)) return;
  if (mode) {
    useToolOnCell(row, col);
    return;
  }
  placeMainNumber(row, col);
}

function placeMainNumber(row, col) {
  if (gameOver || board[row][col] !== null) return;
  const previousHighest = Math.max(highest, maxBoardValue(board));
  savePlacementSnapshot();

  const result = placeTileAndResolve(board, row, col, main);
  board = result.board;
  score += result.scoreGain;
  const currentBoardHighest = maxBoardValue(board);
  highest = Math.max(highest, currentBoardHighest, main);
  if (result.events.length > 0) {
    highest = Math.max(highest, ...result.events.map((event) => event.to));
  }
  const lastEvent = result.events[result.events.length - 1];
  comboText = lastEvent && lastEvent.combo > 1 ? "Combo x" + lastEvent.combo : "";
  main = reserve;
  reserve = generateTile(Math.random(), currentBoardHighest);
  updateRecords();
  if (result.events.length > 0) {
    playMergeSound(result.events, previousHighest);
  } else {
    playSound("place");
  }

  if (isBoardFull(board)) {
    playSound("fail");
    finishGame();
  }
  render();
  clearComboSoon();
}

function swapNumbers() {
  if (gameOver) return;
  playSound("swap");
  const oldMain = main;
  main = reserve;
  reserve = oldMain;
  mode = null;
  render();
}

function selectTool(tool) {
  if (gameOver || tools[tool]) return;
  playSound("click");
  if (tool === "undo") {
    if (!snapshot) return;
    mode = null;
    confirmUndoOpen = true;
    render();
    return;
  }
  mode = mode === tool ? null : tool;
  render();
}

function confirmUndo() {
  confirmUndoOpen = false;
  undoPlacement();
}

function undoPlacement() {
  if (gameOver || tools.undo || !snapshot) return;
  playSound("undo");
  board = copyBoard(snapshot.board);
  score = snapshot.score;
  main = snapshot.main;
  reserve = snapshot.reserve;
  highest = snapshot.highest;
  tools = Object.assign({}, snapshot.tools, { undo: true });
  mode = null;
  comboText = "";
  snapshot = null;
  updateRecords();
  render();
}

function useToolOnCell(row, col) {
  if (mode === "shovel") {
    const liftedValue = board[row][col];
    const nextBoard = applyRecycle(board, row, col);
    if (!nextBoard) return;
    board = nextBoard;
    main = liftedValue;
    tools.shovel = true;
    mode = null;
    updateRecords();
    playSound("shovel");
    flashTool("shovel", [{ row, col }]);
    render();
    return;
  }

  if (mode === "wand") {
    const previousHighest = Math.max(highest, maxBoardValue(board));
    const result = applyUpgrade(board, row, col);
    if (!result) return;
    board = result.board;
    score += result.scoreGain;
    const lastEvent = result.events[result.events.length - 1];
    comboText = lastEvent && lastEvent.combo > 1 ? "Combo x" + lastEvent.combo : "";
    tools.wand = true;
    mode = null;
    updateRecords();
    playSound("wand");
    playMergeSound(result.events, previousHighest);
    flashTool("wand", [{ row, col }, ...result.events.flatMap((event) => event.removed)]);
    render();
    clearComboSoon();
    return;
  }

  if (mode === "bomb") {
    const nextBoard = applyBomb(board, row, col);
    if (!nextBoard) return;
    board = nextBoard;
    tools.bomb = true;
    mode = null;
    updateRecords();
    playSound("bomb");
    flashTool("bomb", [{ row, col }]);
    render();
  }
}

function flashTool(tool, cells) {
  effects = {
    tool,
    cells: new Set(cells.map((cell) => cell.row + ":" + cell.col)),
  };
  window.setTimeout(() => {
    effects = { cells: new Set(), tool: null };
    render();
  }, 520);
}

function clearComboSoon() {
  if (!comboText) return;
  window.setTimeout(() => {
    comboText = "";
    render();
  }, 1200);
}

function finishGame() {
  record.highScore = Math.max(record.highScore, score);
  record.highestTile = Math.max(record.highestTile, highest);
  record.games += 1;
  record.totalSeconds += sessionSeconds;
  sessionSeconds = 0;
  gameOver = true;
  writeRecord();
}

function restart() {
  playSound("restart");
  board = createEmptyBoard();
  score = 0;
  highest = 0;
  main = generateTile(Math.random(), highest);
  reserve = generateTile(Math.random(), highest);
  mode = null;
  snapshot = null;
  gameOver = false;
  confirmUndoOpen = false;
  sessionSeconds = 0;
  comboText = "";
  tools = { undo: false, shovel: false, wand: false, bomb: false };
  effects = { cells: new Set(), tool: null };
  render();
}

window.setInterval(() => {
  if (!gameOver && !showRules) {
    sessionSeconds += 1;
    writeRecord();
    const recordLine = app.querySelector(".record-line");
    if (recordLine) {
      recordLine.textContent =
        "最高数字 " +
        (Math.max(highest, maxBoardValue(board)) || 0) +
        " · 总局数 " +
        record.games +
        " · 游戏时长 " +
        formatTime(sessionSeconds);
    }
  }
}, 1000);

render();

</script>
</body>
</html>
